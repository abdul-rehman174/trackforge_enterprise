{% extends "base.html" %}

{% block title %}TrackForge | {{ title }}{% endblock %}
{% block main_class %}centered{% endblock %}
{% block page_title %}Warehouse Management{% endblock %}

{% block content %}
<div class="form-card">
    <h2>
        <i class="fas {% if form.instance.pk %}fa-warehouse{% else %}fa-plus-square{% endif %}"></i>
        {{ title }}
    </h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-save"></i> Save Warehouse
        </button>
    </form>

    <a href="{% url 'warehouse_list' %}" class="back-link">
        <i class="fas fa-times"></i> Cancel & Return
    </a>
</div>
{% endblock %}
