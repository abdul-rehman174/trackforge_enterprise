{% extends "base.html" %}

{% block title %}TrackForge | {{ title }}{% endblock %}
{% block main_class %}centered{% endblock %}
{% block page_title %}Catalog Management{% endblock %}

{% block content %}
<div class="form-card" style="border-top-color: var(--purple);">
    <h2><i class="fas fa-folder-open"></i> {{ title }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-save"></i> Save Category
        </button>
    </form>

    <a href="{% url 'category_list' %}" class="back-link">
        <i class="fas fa-times"></i> Cancel & Return
    </a>
</div>
{% endblock %}
